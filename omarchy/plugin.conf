# Native plugin build recipe consumed by omarchy/plugin.
NAME=hymission
TARGETS=(hymission hymission-search-input)
# The plugin library comes first; the search helper is found next to it.
FILES=(libhymission.so hymission-search-input)
PACKAGES=(cmake ninja pkgconf gcc lua glib2 gtk4 libadwaita gtk4-layer-shell)
CMAKE_ARGS=(-DBUILD_TESTING=OFF)
